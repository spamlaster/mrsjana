  name: Deploy MrsJana

  on:
    push:
      branches:
        - main

  jobs:
    deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Build production site
          run: npm run build

        - name: Configure SSH
          env:
            SSH_PRIVATE_KEY: ${{ secrets.MRSJANA_DEPLOY_KEY }}
            DEPLOY_HOST: ${{ secrets.MRSJANA_DEPLOY_HOST }}
          run: |
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/mrsjana_deploy
            chmod 600 ~/.ssh/mrsjana_deploy
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

        - name: Deploy to IONOS
          env:
            DEPLOY_HOST: ${{ secrets.MRSJANA_DEPLOY_HOST }}
            DEPLOY_USER: ${{ secrets.MRSJANA_DEPLOY_USER }}
          run: |
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/mrsjana_deploy -o IdentitiesOnly=yes" \
              dist/ \
              "$DEPLOY_USER@$DEPLOY_HOST:/var/www/mrsjana/dist/"