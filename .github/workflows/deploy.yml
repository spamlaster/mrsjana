name: Deploy MrsJana

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments so rsync processes cannot overlap.
concurrency:
  group: mrsjana-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Validate SSH credentials and deploy to IONOS
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MRSJANA_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MRSJANA_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.MRSJANA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MRSJANA_DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Report unexpected failures without logging commands or secret values.
          trap 'status=$?; printf "::error::Deployment command failed at script line %s (exit %s).\n" "$LINENO" "$status"; exit "$status"' ERR
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required deployment setting $name is empty."
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "::error::Invalid deployment host."; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo "::error::Invalid deployment user."; exit 1; }
          if ! test -s dist/index.html; then
            echo "::error::Build output dist/index.html is missing or empty."
            exit 1
          fi

          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/mrsjana-ssh.XXXXXX")"
          trap 'rm -rf "$ssh_dir"' EXIT
          # Preserve real newlines, normalize CRLF, and ensure a final newline.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" > "$ssh_dir/key.pub" 2>/dev/null; then
            echo "::error::MRSJANA_DEPLOY_KEY must contain the complete, unencrypted OpenSSH private key with real newlines."
            exit 1
          fi
          # Public fingerprint only: compare with the working local deployment key.
          ssh-keygen -lf "$ssh_dir/key.pub"
          if ! ssh-keygen -F "$DEPLOY_HOST" -f "$ssh_dir/known_hosts" > /dev/null; then
            echo "::error::MRSJANA_DEPLOY_KNOWN_HOSTS must contain a verified host key entry for MRSJANA_DEPLOY_HOST."
            exit 1
          fi
          echo "Pinned SSH host entry found."

          ssh_command=(ssh -F /dev/null -i "$ssh_dir/key"
            -o IdentityAgent=none -o IdentitiesOnly=yes
            -o BatchMode=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3)

          echo "Testing SSH connectivity with the deployment key and pinned host keys..."
          if ! "${ssh_command[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'printf "%s\n" "SSH connectivity verified."'; then
            echo "::error::SSH connectivity failed. See the SSH error above; no files were deployed."
            exit 1
          fi

          # Remote test failures normally have no output. Explain each prerequisite.
          if ! "${ssh_command[@]}" "$DEPLOY_USER@$DEPLOY_HOST" '
            if ! test -d /var/www/mrsjana/dist; then
              echo "::error::Deployment directory /var/www/mrsjana/dist does not exist." >&2
              exit 1
            fi
            if ! test -x /var/www/mrsjana/dist; then
              echo "::error::SSH user cannot traverse /var/www/mrsjana/dist." >&2
              exit 1
            fi
            if ! test -w /var/www/mrsjana/dist; then
              echo "::error::SSH user cannot write to /var/www/mrsjana/dist." >&2
              exit 1
            fi
            if ! command -v rsync >/dev/null; then
              echo "::error::rsync is missing from the remote SSH command PATH." >&2
              exit 1
            fi
            printf "%s\n" "Remote deployment prerequisites verified."
          '; then
            echo "::error::Remote deployment preflight failed. See the diagnostic above; no files were deployed."
            exit 1
          fi

          echo "Deploying dist/ to /var/www/mrsjana/dist/..."
          rsync -avz --delete --delay-updates \
            -e "${ssh_command[*]}" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/mrsjana/dist/"
